- type: entity
  parent: BaseGameRule
  id: ThiefFeatherlight
  components:
  - type: GameRule
    minPlayers: 1
    delay:
      min: 240
      max: 420
  - type: ThiefRule
  - type: AntagRandomObjectives
    sets:
    - groups: ThiefObjectiveGroupOuter
      maxPicks: 10
    maxDifficulty: 4 # Less theives, harder job
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: PrePlayerSpawn
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Thief
      playerRatio: 15
      range:
        min: 1
        max: 2
  - type: DynamicRuleCost
    cost: 75
